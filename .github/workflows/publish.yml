name: Publish
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 发布队列或回收数据
        type: choice
        options: [publish, metrics]
        default: publish
permissions:
  contents: write
concurrency:
  group: automation-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node --test
      - name: Publish due posts
        if: github.event_name == 'schedule' || inputs.task == 'publish'
        run: node src/publish.mjs
      - name: Collect metrics
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'metrics'
        run: |
          node src/metrics.mjs
          git add metrics
          if ! git diff --cached --quiet; then
            git commit -m 'Collect interaction metrics'
            git push
          fi
